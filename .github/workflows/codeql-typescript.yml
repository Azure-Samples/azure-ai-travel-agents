name: "CodeQL TypeScript"

on:
  push:
    branches: [main]
    paths:
      - 'packages/api-langchain-js/*.ts'
      - 'packages/api-langchain-js/*.js'
      - 'packages/api-llamaindex-ts/*.ts'
      - 'packages/api-llamaindex-ts/*.js'
      - 'packages/ui-angular/*.ts'
      - 'packages/ui-angular/*.js'
      - 'packages/mcp-servers/echo-ping/**/*.ts'
      - 'packages/mcp-servers/echo-ping/**/*.js'
      - '.github/workflows/codeql-typescript.yml'
      - '.github/codeql/typescript-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/api-langchain-js/*.ts'
      - 'packages/api-langchain-js/*.js'
      - 'packages/api-llamaindex-ts/*.ts'
      - 'packages/api-llamaindex-ts/*.js'
      - 'packages/ui-angular/*.ts'
      - 'packages/ui-angular/*.js'
      - 'packages/mcp-servers/echo-ping/**/*.ts'
      - 'packages/mcp-servers/echo-ping/**/*.js'
      - '.github/workflows/codeql-typescript.yml'
      - '.github/codeql/typescript-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze TypeScript Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          for dir in packages/mcp-servers/echo-ping packages/api-langchain-js packages/api-llamaindex-ts packages/ui-angular; do
            if [ -f "$dir/package.json" ]; then
              cd $dir && npm install && cd -
            fi
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: typescript
          config-file: .github/codeql/typescript-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "typescript-analysis"
          upload: true