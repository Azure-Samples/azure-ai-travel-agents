name: "CodeQL Java"

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-servers/destination-recommendation/src/main/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/src/test/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/pom.xml'
      - 'packages/mcp-servers/destination-recommendation/*.gradle'
      - '.github/workflows/codeql-java.yml'
      - '.github/codeql/java-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-servers/destination-recommendation/src/main/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/src/test/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/pom.xml'
      - 'packages/mcp-servers/destination-recommendation/*.gradle'
      - '.github/workflows/codeql-java.yml'
      - '.github/codeql/java-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Cache Maven dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2      
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: java
          config-file: .github/codeql/java-config.yml
          
      - name: Build Java with Maven
        run: |
          cd packages/mcp-servers/destination-recommendation
          mvn clean compile -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "java-analysis"
          upload: true