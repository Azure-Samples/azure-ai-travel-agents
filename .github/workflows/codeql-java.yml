name: "CodeQL Java"

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-servers/destination-recommendation/src/main/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/src/test/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/pom.xml'
      - 'packages/mcp-servers/destination-recommendation/*.gradle'
      - '.github/workflows/codeql-java.yml'
      - '.github/codeql/java-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-servers/destination-recommendation/src/main/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/src/test/java/**/*.java'
      - 'packages/mcp-servers/destination-recommendation/pom.xml'
      - 'packages/mcp-servers/destination-recommendation/*.gradle'
      - '.github/workflows/codeql-java.yml'
      - '.github/codeql/java-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze Java Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2      
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java
          config-file: .github/codeql/java-config.yml
          
      - name: Build Java with Maven
        run: |
          cd packages/mcp-servers/destination-recommendation
          mvn clean compile -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "java-analysis"
          upload: true