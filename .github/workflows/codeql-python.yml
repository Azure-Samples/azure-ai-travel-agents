name: "CodeQL Python"

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-servers/itinerary-planning/**/*.py'
      - 'packages/mcp-servers/model-inference/**/*.py'
      - '.github/workflows/codeql-python.yml'
      - '.github/codeql/python-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-servers/itinerary-planning/**/*.py'
      - 'packages/mcp-servers/model-inference/**/*.py'
      - '.github/workflows/codeql-python.yml'
      - '.github/codeql/python-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          for dir in packages/mcp-servers/itinerary-planning packages/mcp-servers/model-inference; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r $dir/requirements.txt
            fi
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          config-file: .github/codeql/python-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "python-analysis"
          upload: true