name: "CodeQL Python"

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-servers/itinerary-planning/**/*.py'
      - 'packages/mcp-servers/model-inference/**/*.py'
      - '.github/workflows/codeql-python.yml'
      - '.github/codeql/python-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-servers/itinerary-planning/**/*.py'
      - 'packages/mcp-servers/model-inference/**/*.py'
      - '.github/workflows/codeql-python.yml'
      - '.github/codeql/python-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          for dir in packages/mcp-servers/itinerary-planning packages/mcp-servers/model-inference; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r $dir/requirements.txt
            fi
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: python
          config-file: .github/codeql/python-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "python-analysis"
          upload: true