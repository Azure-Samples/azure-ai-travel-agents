name: "CodeQL C#"

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-servers/customer-query/**/*.cs'
      - 'packages/mcp-servers/customer-query/**/*.csproj'
      - 'packages/mcp-servers/customer-query/**/*.sln'
      - 'packages/mcp-servers/customer-query/AITravelAgent.*/**'
      - '.github/workflows/codeql-csharp.yml'
      - '.github/codeql/csharp-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-servers/customer-query/**/*.cs'
      - 'packages/mcp-servers/customer-query/**/*.csproj'
      - 'packages/mcp-servers/customer-query/**/*.sln'
      - 'packages/mcp-servers/customer-query/AITravelAgent.*/**'
      - '.github/workflows/codeql-csharp.yml'
      - '.github/codeql/csharp-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: csharp
          config-file: .github/codeql/csharp-config.yml
          
      - name: Restore and Build C#
        run: |
          if [ -d "packages/mcp-servers/customer-query" ]; then
            dotnet restore packages/mcp-servers/customer-query/AITravelAgent.sln
            dotnet build packages/mcp-servers/customer-query/AITravelAgent.sln --configuration Release --no-restore
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "csharp-analysis"
          upload: true