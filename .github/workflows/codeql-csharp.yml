name: "CodeQL C#"

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-servers/customer-query/**/*.cs'
      - 'packages/mcp-servers/customer-query/**/*.csproj'
      - 'packages/mcp-servers/customer-query/**/*.sln'
      - 'packages/mcp-servers/customer-query/AITravelAgent.*/**'
      - '.github/workflows/codeql-csharp.yml'
      - '.github/codeql/csharp-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-servers/customer-query/**/*.cs'
      - 'packages/mcp-servers/customer-query/**/*.csproj'
      - 'packages/mcp-servers/customer-query/**/*.sln'
      - 'packages/mcp-servers/customer-query/AITravelAgent.*/**'
      - '.github/workflows/codeql-csharp.yml'
      - '.github/codeql/csharp-config.yml'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp
          config-file: .github/codeql/csharp-config.yml
          
      - name: Restore and Build C#
        run: |
          if [ -d "packages/mcp-servers/customer-query" ]; then
            dotnet restore packages/mcp-servers/customer-query/AITravelAgent.sln
            dotnet build packages/mcp-servers/customer-query/AITravelAgent.sln --configuration Release --no-restore
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "csharp-analysis"
          upload: true