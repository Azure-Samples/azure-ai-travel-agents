name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-api-langchain:
    name: API LangChain.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/api-langchain-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm i
      - run: npm run build

  build-api-llamaindex:
    name: API LlamaIndex.TS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/api-llamaindex-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm i
      - run: npm run build

  build-api-maf-python:
    name: API Microsoft Agent Framework (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/api-maf-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .

  build-ui-angular:
    name: UI Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/ui-angular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm i
      - run: npm run build

  build-customer-query:
    name: MCP Customer Query (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/mcp-servers/customer-query
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

  build-destination-recommendation:
    name: MCP Destination Recommendation (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/mcp-servers/destination-recommendation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 24
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '24'
      - run: mvn clean install -DskipTests

  build-echo-ping:
    name: MCP Echo Ping (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/mcp-servers/echo-ping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm i
      - run: npm run build

  build-itinerary-planning:
    name: MCP Itinerary Planning (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/mcp-servers/itinerary-planning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
